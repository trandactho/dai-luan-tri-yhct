[build]
  publish = "."
  functions = "netlify/functions"

# 1. CẤU HÌNH REDIRECTS (Thứ tự từ cụ thể đến tổng quát)
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 2. CẤU HÌNH HEADERS (Gộp chung Bảo mật & CORS vào 1 khối)
[[headers]]
  for = "/*"
  [headers.values]
    # Header bảo mật
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "unload=*"
    
    # Header CORS
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
